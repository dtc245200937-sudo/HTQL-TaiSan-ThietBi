version: '3.8'

networks:
  frontend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  backend-net:
    driver: bridge
    internal: false # Allow backend communication
    ipam:
      config:
        - subnet: 172.28.2.0/24
  monitoring-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.3.0/24

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # 1. Asset Management Web App
  web-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: web-app
    restart: always
    user: "10001:10001"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 2. Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # 3. Database Management Tool pgAdmin
  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 4. Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      - web-app
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # 5. Prometheus Metrics Server
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: always
    user: "65534:65534" # nobody user
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 6. Grafana Dashboard System
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(port)s/grafana/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 7. PostgreSQL Metrics Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - backend-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy

  # 8. Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx:8080/nginx_status
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      - nginx

  # 9. cAdvisor Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-net

  # 10. Loki Log Aggregation System
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 11. Promtail Log Collector
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-net
    depends_on:
      - loki
